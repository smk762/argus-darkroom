# Optional: mount the suite settings file (argus_cortex.settings) into the darkroom container, read-only.
#
#   python -m argus_cortex.settings --init                # creates ~/.config/argus/suite.env, mode 600
#   COMPOSE_FILE=compose.yaml:compose.suite.yaml          # in .env, or pass both files with -f
#
# A separate file because compose cannot make a bind mount optional: with it in compose.yaml, a host without a
# suite file would not start. Anything set in .env or the environment still wins over the file.
#
# Known limit (smk762/argus-cortex#218): argus-cortex reads the file only when it belongs to the user reading it or
# to root, and darkroom's image runs as its own unprivileged user (uid 10001), which cannot open a mode-600 file
# owned by you. So today the mounted file must be owned by root. A file that is refused or cannot be read is the
# same as no file: a warning in the log, and darkroom starts only if .env names SingGuard.
services:
  darkroom:
    volumes:
      - type: bind
        source: "${ARGUS_SUITE_ENV:-${HOME}/.config/argus/suite.env}"
        target: /etc/argus/suite.env
        read_only: true
        bind: {create_host_path: false}
