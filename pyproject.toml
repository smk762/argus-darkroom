[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-darkroom"
dynamic = ["version"]
description = "Guarded image generation for the Argus suite: prompts and outputs are checked before anything is released."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # [server] is for env_flag, which the config reads even without the HTTP server
    "argus-cortex[images,server]>=0.4.3,<0.5",
    "pydantic>=2.7",
    # ComfyUI returns the image over its websocket; stdlib has no client
    "websockets>=15",
    # perceptual hash of every output, kept even when the pixels are not
    "ImageHash>=4.3",
    "structlog>=24.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
cli = ["typer>=0.12", "rich>=13.0"]
# MiVOLO age estimates through curator's face pipeline, in process. Also needs the ONNX file (`argus-curator
# mivolo-convert`); without it the age check is skipped and /health says so.
age = ["argus-curator[faces]>=0.9,<0.10"]
# httpx2 backs starlette's TestClient: starlette >=1.3 deprecated the httpx path
# and raises when neither client is installed, so testing the server needs it.
# argus-curator (no faces) gives the tests curator's result models for a fake detect_faces
dev = ["argus-curator>=0.9,<0.10", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.15.16", "httpx2>=2.7"]

[project.scripts]
argus-darkroom = "argus_darkroom.cli:app"

[project.urls]
Repository = "https://github.com/smk762/argus-darkroom"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_darkroom/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_darkroom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_darkroom/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
