# argus-iris GPU tenant manifest for argus-darkroom (#53).
# Validated by argus-cortex's TenantManifest (gpu-tenant-schema.json, tenant_version 1.0); tests/test_gpu.py fails if
# it stops validating or drifts from the figures in src/argus_darkroom/gpu.py.
#
# With ARGUS_GPU_BROKER_URL set, darkroom's server registers this with the broker at startup (argus-cortex finds it
# in the working directory or at /app/gpu-tenant.yaml, where the Docker image ships it). Tokens never go here:
# ARGUS_GPU_BROKER_TOKEN lives in the host's .env.
#
# VRAM figures are MiB. The broker uses its learned p95 per kind when that is larger, so a heavier checkpoint
# (Flux) or a larger Ollama model is caught after a few leases.
#
# Each lease names its priority class: the caller's X-Argus-Priority (mint's sample runs send batch; a person at
# safelight or studio sends nothing, which is interactive). The priorities below are the defaults when a lease does
# not say. Darkroom cannot stop a render part way, so no kind is preemptible.
tenant: argus-darkroom
description: Guarded image generation. Every prompt and output is checked before anything is released.
repo: smk762/argus-darkroom

kinds:
  # One image: text-to-image, image-to-image or inpainting, rendered by ComfyUI.
  - kind: generate
    target: comfyui
    vram_mb: 9000
    model_mb: 6500 # the SDXL checkpoint, which stays loaded in ComfyUI
    priority: interactive
    preemptible: false
    description: One guarded generation, rendered by ComfyUI.

  # A depth map of a released image (POST /depth/{id}): Depth Anything V2 Small, in ComfyUI.
  - kind: depth
    target: comfyui
    vram_mb: 1500
    model_mb: 500
    priority: interactive
    preemptible: false
    description: A depth map of a stored image, rendered by ComfyUI.

  # Prompt expansion. The lease names the configured model (ollama:$ARGUS_DARKROOM_OLLAMA_MODEL); this is the usual one.
  - kind: expand
    target: "ollama:qwen3:8b"
    vram_mb: 6000
    model_mb: 5200 # the model, which stays loaded in Ollama
    priority: interactive
    preemptible: false
    description: Expanding a short prompt into a full one before it is checked.

# Darkroom keeps no model loaded itself: ComfyUI and Ollama hold the weights, and declare them in their own manifests.
residents: []
