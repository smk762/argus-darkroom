name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: smk762/argus-ci/.github/workflows/python-ci.yml@v1
    with:
      ruff-version: "0.15.16"
      test-extras: "dev"

  # The wire schema is a contract other repos generate code from: a model change must come with the regenerated file.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads the version from git history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv venv && uv pip install -e ".[cli]"
      - run: uv run --no-sync argus-darkroom schema --check

