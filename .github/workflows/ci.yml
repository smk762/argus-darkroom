name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: smk762/argus-ci/.github/workflows/python-ci.yml@723ba8f53f7f3a658c62506b741e59a20703c71f
    with:
      ruff-version: "0.15.16"
      test-extras: "dev"

  # The wire schema is a contract other repos generate code from: a model change must come with the regenerated file.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads the version from git history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv venv && uv pip install -e ".[cli]"
      - run: uv run --no-sync argus-darkroom schema --check

  suite-rules:
    # argus-ci suite rules: lint rules that each eliminate a finding class. New violations fail;
    # existing ones are in .suite-rules-baseline.json, which may only shrink.
    uses: smk762/argus-ci/.github/workflows/suite-rules.yml@723ba8f53f7f3a658c62506b741e59a20703c71f
    with:
      rules-ref: 723ba8f53f7f3a658c62506b741e59a20703c71f
